name: Test and deploy KenKen Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kenken-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU models and dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r web/requirements.txt 'gradio>=5,<7'
      - name: Build static gallery with the original pipeline
        env:
          MPLBACKEND: Agg
        run: python web/build.py --precompute
      - name: Test all Python code
        env:
          MPLBACKEND: Agg
        run: python -m pytest --junitxml=scratch/ci-results.xml
      - name: Test browser solver
        run: node --test web/tests/solver.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: scratch/ci-results.xml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
